<main class="container">
    <!-- Título da página -->
    <div id="title-div" style="border-bottom: 1px solid black;">
        <h1 class="page-title">Adicionar paciente na fila</h1>
    </div>

    <!-- Formulário de cadastro -->
    <form (ngSubmit)="adicionarPacienteFila()" #pacienteForm="ngForm" class="mt-5">
        <div class="row mb-3">
            <div class="col-sm-4">
                <label for="nome" class="form-label">Senha da fila:</label>
                <input type="text" id="nome" class="form-control" required [(ngModel)]="queueTicket" name="nome">
            </div>
            <div class="col-sm-3">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" id="cpf" class="form-control" maxlength="14" placeholder="000.000.000-00"
                    [(ngModel)]="cpfBusca" name="cpf" (input)="formatarCPF()" (blur)="buscarPacientePorCpf()" required>
            </div>

            <!-- Resultado da busca -->
            <div *ngIf="pacienteEncontrado" class="mt-4">
                <h5 style="color: #1487ff;">Paciente Encontrado:</h5>
                <p><strong>Nome: </strong> {{ pacienteEncontrado.name }}</p>
                <p><strong>Idade: </strong> {{ pacienteEncontrado.age }} anos</p>
                <p><strong>Gênero: </strong> {{ pacienteEncontrado.gender }}</p>
            </div>
        </div>


        <!-- Botões -->
        <div class="row mt-4">
            <div class="col text-end">
                <button type="submit" class="btn btn-primary" [disabled]="!pacienteForm.form.valid">Cadastrar</button>
            </div>
        </div>
    </form>


    <!-- Modal de Sucesso -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-success">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="successModalLabel">Sucesso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    {{ mensagemModal }}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Erro -->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-danger">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="errorModalLabel">Erro ao realizar cadastro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    {{ mensagemModal }}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

</main>
