<main class="container">
    <!-- Título da página -->
    <div id="title-div" style="border-bottom: 1px solid black;">
        <h1 class="page-title">Cadastro de Paciente</h1>
    </div>

    <!-- Botões -->
    <div class="row mt-4">
        <div class="col text-end">
            <a class="btn btn-primary" routerLink="/medical/cases/add-queue">+ Adicionar paciente existente à fila</a>
        </div>
    </div>

    <!-- Formulário de cadastro -->
    <form (ngSubmit)="cadastrarPaciente()" #pacienteForm="ngForm" class="mt-5">
        <div class="row mb-3">
            <div class="col-sm-6">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" id="nome" class="form-control" required [(ngModel)]="patient.name" name="nome">
            </div>
            <div class="col-sm-3">
                <label for="idade" class="form-label">Idade:</label>
                <input type="number" id="idade" class="form-control" required [(ngModel)]="patient.age" name="idade">
            </div>
            <div class="col-sm-3">
                <label for="genero" class="form-label">Gênero:</label>
                <select id="genero" class="form-select" required [(ngModel)]="patient.gender" name="genero">
                    <option value="" disabled selected>Selecione</option>
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                    <option value="O">Outro</option>
                </select>
            </div>
            <div class="col-sm-3" style="margin-top: 2vh;">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" id="cpf" class="form-control" maxlength="14" placeholder="000.000.000-00"
                    [(ngModel)]="patient.cpf" name="cpf" (input)="formatarCPF()" required>
            </div>

            <!-- Checkbox para ativar o campo -->
            <div class="form-check" style="margin-top: 2vh;">
                <input type="checkbox" class="form-check-input" id="enableQueueTicket" [(ngModel)]="enableQueue"
                    name="enableQueue">
                <label class="form-check-label" for="enableQueueTicket">Inserir paciente na fila</label>
            </div>

            <!-- Campo que aparece apenas se o checkbox estiver marcado -->
            <div class="col-sm-3" style="margin-top: 2vh;" *ngIf="enableQueue">
                <label for="queueTicket" class="form-label">Senha da fila:</label>
                <input type="text" id="queueTicket" class="form-control" [(ngModel)]="patient.queueTicket"
                    name="queueTicket" [required]="enableQueue">
            </div>

        </div>


        <!-- Botões -->
        <div class="row mt-5">
            <div class="col-sm-2">
                <a class="btn btn-secondary" style="width: 4vw;" routerLink="/medical/cases">Voltar</a>
            </div>
            <div class="col text-end">
                <button type="submit" class="btn btn-primary" [disabled]="!pacienteForm.form.valid">Cadastrar</button>
            </div>
        </div>
    </form>


    <!-- Modal de Sucesso -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-success">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="successModalLabel">Sucesso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    A operação foi concluída com sucesso!
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Erro -->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-danger">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="errorModalLabel">Erro ao realizar cadastro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    {{ mensagemModal }}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

</main>
