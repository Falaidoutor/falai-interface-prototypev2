<div class="center-layout">
  <h2>Formulário de Triagem</h2>
  <form>
    <!-- Dados básicos -->
    <div class="form-group">
      <label for="nome">Nome: Gustavo Martins</label>
    </div>

    <div class="form-group">
      <label for="idade">Idade: 19</label>
    </div>

    <!-- Sintomas com slider -->
    <h3>Avalie a intensidade dos sintomas</h3>

    <div class="sintoma">
      <label>Dor no peito:</label>
      <input type="range" min="0" max="5" step="1" value="0" />
    </div>

    <div class="sintoma">
      <label>Falta de ar:</label>
      <input type="range" min="0" max="5" step="1" value="0" />
    </div>

    <div class="sintoma">
      <label>Febre alta:</label>
      <input type="range" min="0" max="5" step="1" value="0" />
    </div>

    <div class="sintoma">
      <label>Tontura:</label>
      <input type="range" min="0" max="5" step="1" value="0" />
    </div>

    <div class="sintoma">
      <label>Náusea / Vômito:</label>
      <input type="range" min="0" max="5" step="1" value="0" />
    </div>

    <div class="sintoma">
      <label>Dor de cabeça intensa:</label>
      <input type="range" min="0" max="5" step="1" value="0" />
    </div>

    <div class="sintoma">
      <label>Sangramento:</label>
      <input type="range" min="0" max="5" step="1" value="0" />
    </div>

    <!-- Botão -->
    <button type="submit">Enviar</button>
  </form>
</div>
